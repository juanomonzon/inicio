<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inicio — RC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #111; --border: #1e1e1e;
    --accent: #c8f060; --accent2: #60c8f0; --txt: #f0f0f0; --muted: #444;
    --mono: 'DM Mono', monospace; --display: 'Syne', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: var(--mono); overflow-x: hidden; }
  
  .wrap {
    position: relative; z-index: 1; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 20px; gap: 24px;
  }

  .header { display: flex; flex-direction: column; gap: 4px; opacity: 0; animation: fadeUp 0.6s ease forwards; }
  .header-title { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
  .header-time { font-size: 11px; color: var(--muted); }

  /* Grid Inteligente */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    width: 100%;
  }

  .card {
    position: relative; height: 160px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 14px; text-decoration: none; color: var(--txt);
    opacity: 0; animation: fadeUp 0.5s ease forwards;
  }

  .card-icon { position: absolute; top: 12px; right: 12px; font-size: 28px; }
  .card-tag { font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  
  .card-name { 
    font-family: var(--display); font-size: 14px; font-weight: 700; 
    line-height: 1.1; margin-bottom: 4px;
    hyphens: auto; word-wrap: break-word; /* Evita que el texto se salga */
  }
  
  .card-url { font-size: 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.6; }

  /* Colores */
  .card-1 .card-name, .card-3 .card-name { color: #c8f060; }
  .card-2 .card-name, .card-5 .card-name { color: #60c8f0; }
  .card-4 .card-name { color: #f0b460; }

  .footer { margin-top: auto; font-size: 10px; color: var(--muted); padding-top: 20px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Si la pantalla es muy chica (iPhone SE), pasamos a 1 sola columna */
  @media (max-width: 340px) {
    .grid { grid-template-columns: 1fr; }
    .card { height: 120px; }
    .card-icon { font-size: 24px; }
  }
</style>
</head>
<body>
</body>
</html>
