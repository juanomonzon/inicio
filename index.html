<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Cultural — Guiones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c0c; --surface: #141414; --surface2: #1c1c1c; --border: #272727;
    --accent: #c8f060; --accent2: #60c8f0; --txt: #efefef; --muted: #666;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: var(--sans); }
  .app { height: 100vh; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; }
  .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; background: var(--surface); flex-shrink: 0; }
  .logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #0c0c0c; font-family: var(--mono); flex-shrink: 0; }
  .hinfo { flex: 1; }
  .htitle { font-size: 15px; font-weight: 500; }
  .hsub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: var(--mono); color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: all 0.4s; background: #333; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.loading { background: #f0b060; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .ebar { padding: 9px 24px; border-bottom: 1px solid var(--border); font-size: 11px; font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .ebar .cnt { color: var(--accent2); }
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg { display: flex; flex-direction: column; gap: 5px; }
  .msg.user { align-items: flex-end; }
  .msg.bot { align-items: flex-start; }
  .msg-who { font-size: 10px; font-family: var(--mono); color: var(--muted); padding: 0 4px; }
  .bubble { padding: 13px 17px; border-radius: 14px; font-size: 13.5px; line-height: 1.65; max-width: 88%; }
  .msg.user .bubble { background: var(--accent); color: #0c0c0c; font-weight: 500; border-radius: 14px 14px 3px 14px; }
  .msg.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 14px 14px 14px 3px; font-family: var(--mono); font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; max-width: 100%; width: 100%; }
  .typing-dots { display: flex; gap: 5px; align-items: center; padding: 3px 0; }
  .typing-dots span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

  .recursos-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-top: 10px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .recursos-title { font-size: 10px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; }
  .recurso-item { display: flex; align-items: center; gap: 10px; }
  .recurso-img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .recurso-info { flex: 1; min-width: 0; }
  .recurso-nombre { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
  .recurso-btns { display: flex; gap: 6px; }
  .recurso-btn { font-size: 10px; font-family: var(--mono); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); text-decoration: none; color: var(--muted); }
  .recurso-btn:hover { border-color: var(--accent); color: var(--accent); }

  .quick-area { padding: 0 24px 14px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .quick { font-size: 11px; font-family: var(--mono); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .input-area { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .input-wrap { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; display: flex; }
  textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--txt); padding: 11px 15px; resize: none; min-height: 44px; max-height: 130px; font-family: var(--sans); font-size: 13.5px; }
  .send { background: var(--accent); border: none; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">RC</div>
    <div class="hinfo">
      <div class="htitle">Radar Cultural — Guiones</div>
      <div class="hsub">radarcultural.vercel.app · @radarcultural_</div>
    </div>
    <div class="status">
      <div class="dot loading" id="dot"></div>
      <span id="statusTxt">cargando...</span>
    </div>
  </div>
  <div class="ebar" id="eventsBar">Conectando con Supabase...</div>
  <div class="chat" id="chat">
    <div class="msg bot">
      <div class="msg-who">asistente</div>
      <div class="bubble" id="firstMsg">Cargando eventos del mapa... un segundo.</div>
    </div>
  </div>
  <div class="quick-area" id="quickArea" style="display:none">
    <button class="quick" onclick="qs('Haceme un reel de evento puntual')">→ evento puntual</button>
    <button class="quick" onclick="qs('Haceme una agenda semanal')">→ agenda semanal</button>
    <button class="quick" onclick="qs('Qué eventos hay disponibles?')">→ ver eventos</button>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="inp" placeholder="Describí el guion..." onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
    </div>
    <button class="send" id="sendBtn" onclick="send()" disabled>↑</button>
  </div>
</div>

<script>
const SB_URL = "https://boeurmldeqvcaikdhtvy.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZXVybWxkZXF2Y2Fpa2RodHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODAwNjMsImV4cCI6MjA4ODc1NjA2M30.uinIL95NHpsqMzf1sXHuPTsr5NElZDAhpb61xRM6-08";

// LÓGICA GEMINI 1.5 FLASH
const GEMINI_KEY = "AIzaSyDDJD8tC2tEG6OvkKYK4GfeWIKre1BNSVw";
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

let history = [];
let busy = false;
let eventosCache = [];

const SYSTEM = `Sos el asistente de edición de Radar Cultural (@radarcultural_), agenda cultural interactiva de Buenos Aires. 
REGLA ABSOLUTA: SOLO generás guiones de grabación de pantalla del mapa interactivo... (aquí va el resto de tus reglas originales)`;

async function loadEvents() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/eventos?select=*&order=fecha_evento.asc`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    });
    const eventos = await r.json();
    eventosCache = eventos;

    document.getElementById('dot').className = 'dot ok';
    document.getElementById('statusTxt').textContent = `${eventos.length} eventos`;
    document.getElementById('eventsBar').innerHTML = `<span class="cnt">${eventos.length} eventos cargados</span>`;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('quickArea').style.display = 'flex';

    const lista = eventos.map(e => `- ${e.titulo} | ${e.lugar} | ${e.fecha_evento}`).join('\n');
    
    // Inicializar historial con formato Gemini
    history = [
      { role: "user", parts: [{ text: SYSTEM + "\n\nEVENTOS CARGADOS:\n" + lista }] },
      { role: "model", parts: [{ text: "Entendido. Tengo los eventos cargados. ¿Qué guion necesitas?" }] }
    ];

    document.getElementById('firstMsg').textContent = `Listo. Cargué ${eventos.length} eventos del mapa. ¿Qué tipo de guion necesitás?`;
  } catch(e) { console.error(e); }
}

async function send() {
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt || busy) return;

  addMsg('user', txt);
  inp.value = ''; resize(inp);
  busy = true; document.getElementById('sendBtn').disabled = true;
  addTyping();

  history.push({ role: "user", parts: [{ text: txt }] });

  try {
    const r = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history })
    });
    const data = await r.json();
    const reply = data.candidates[0].content.parts[0].text;

    rmTyping();
    addMsg('bot', reply);
    history.push({ role: "model", parts: [{ text: reply }] });
  } catch(e) {
    rmTyping(); addMsg('bot', 'Error de conexión con Gemini.');
    console.error(e);
  }
  busy = false; document.getElementById('sendBtn').disabled = false;
}

function addMsg(role, txt) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
  const txtLimpio = txt.split('\n').filter(l => !l.trim().startsWith('EVENTO_USADO:')).join('\n').trim();
  d.innerHTML = `<div class="msg-who">${role === 'user' ? 'vos' : 'asistente'}</div><div class="bubble">${txtLimpio}</div>`;
  if (role !== 'user') {
    const card = buildRecursosCard(txt);
    if (card) d.appendChild(card);
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

function buildRecursosCard(replyText) {
  const usados = replyText.split('\n').filter(l => l.includes('EVENTO_USADO:')).map(l => l.replace('EVENTO_USADO:', '').trim());
  if (usados.length === 0) return null;
  const card = document.createElement('div');
  card.className = 'recursos-card';
  card.innerHTML = `<div class="recursos-title">📎 Recursos visuales</div>`;
  usados.forEach(titulo => {
    const e = eventosCache.find(ev => ev.titulo.trim() === titulo);
    if (e) {
      card.innerHTML += `
        <div class="recurso-item">
          <img src="${e.imagen_url}" class="recurso-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1NiIgaGVpZ2h0PSI1NiI+PHJlY3Qgd2lkdGg9IjU2IiBoZWlnaHQ9IjU2IiBmaWxsPSIjMjIyIi8+PC9zdmc+'">
          <div class="recurso-info">
            <div class="recurso-nombre">${e.titulo}</div>
            <div class="recurso-btns">
              ${e.imagen_url ? `<a href="${e.imagen_url}" target="_blank" class="recurso-btn">Imagen</a>` : ''}
              ${e.instagram_url ? `<a href="${e.instagram_url}" target="_blank" class="recurso-btn">IG</a>` : ''}
            </div>
          </div>
        </div>`;
    }
  });
  return card;
}

function addTyping() { 
  const d = document.createElement('div'); d.id = 'typing'; d.className = 'msg bot';
  d.innerHTML = `<div class="msg-who">asistente</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  document.getElementById('chat').appendChild(d);
}
function rmTyping() { document.getElementById('typing')?.remove(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function resize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function qs(txt) { document.getElementById('inp').value = txt; send(); }

loadEvents();
</script>
</body>
</html>
